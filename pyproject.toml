[project]
name = "agentcore"
version = "0.1.0"
description = "Desktop-first AI agent platform: Windows controller + Android remote companion"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24",
    "sqlalchemy>=2.0",
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml",
    "rich",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "pypdf>=4",
    "numpy>=1.26",
]

[tool.uv]
package = false

[tool.setuptools]
packages = ["agentcore"]
