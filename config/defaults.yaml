# AgentCore defaults — overridable via config/local.yaml, then env vars, then secrets.
app:
  name: AgentCore
  data_dir: ./data
  log_dir: ./logs

llm:
  provider_priority:
    - openai
  default_model:
    openai: auto
  base_url:
    openai: http://127.0.0.1:31415/v1
  temperature: 0.7
  max_tokens: 700

memory:
  stm_window_messages: 20
  ltm_top_k: 8
  knowledge_top_k: 5
  summarize_on_overflow: true

agent:
  max_loop_iterations: 12
  confirm_high_permission: true

planner:
  max_attempts: 3

executor:
  max_runtime_s: 120.0
  max_steps: 8
  max_cost: 1.0            # USD; 0 = unlimited
  max_tokens: 50000
  max_retries: 2
  max_recursion_depth: 3
  step_timeout_s: 90.0

observer:
  network_host: 1.1.1.1
  poll_interval_s: 10

tools:
  allowlist: []            # empty = all tools allowed at their declared level
  denylist: []
  sandbox_root: ./data/sandbox

devices:
  reconnect_backoff_s: [1, 2, 4, 8, 16]
  heartbeat_s: 20
  adb_host: 127.0.0.1
  adb_port: 5555

voice:
  # PRIMARY interface. stt: fasterwhisper (offline, free, DEFAULT) |
  # openrouter (whisper via your OpenRouter key — needs audio balance) |
  # vosk (offline, light). tts: edge (neural) | sapi (windows offline).
  stt_provider: fasterwhisper
  stt_language: auto              # auto (multilingual) | en | hi
  # whisper_model is auto-selected based on stt_language:
  #   - "en" → base.en (English-only, faster)
  #   - "auto" or other → base (multilingual)
  # Override only if you need a specific model (tiny.en, small.en, etc.)
  # whisper_model: base.en
  stt_model: openai/whisper-1     # used only by the openrouter STT provider
  vosk_model_path: data/voice/vosk-model
  tts_provider: edge
  tts_voice: en-US-ChristopherNeural
  session_id: voice
  sample_rate: 16000
  silence_after_s: 1.2
  max_record_s: 15.0
  wake_word_enabled: false   # deferred until the basic pipeline is reliable

  # Phase 4: Control whether persistent voice starts automatically in the launcher
  enable_on_launch: true    # Packaged default: start persistent voice
